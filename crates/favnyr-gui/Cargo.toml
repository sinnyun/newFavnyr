[package]
name = "favnyr-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Favnyr's Slint user interface (main binary)."
publish = false   # application (never published to crates.io)

[[bin]]
name = "favnyr"
path = "src/main.rs"

[dependencies]
favnyr-core = { path = "../favnyr-core" }
slint       = { workspace = true }
tracing     = { workspace = true }
anyhow      = { workspace = true }
notify      = { workspace = true }
dirs        = { workspace = true }
open        = { workspace = true }
arboard     = { workspace = true }
toml        = { workspace = true }

# Declared for its FEATURE, not its API: nothing here imports `icu_provider`.
#
# It turns ON icu_provider's `logging` feature, which routes ICU4X's own
# diagnostics through `log`/`tracing` like every other dependency's. Without it,
# ICU4X's internal log shim aliases `warn` to `std::eprintln!` in debug builds
# (see icu_provider/src/lib.rs) — straight to stderr, invisible to the log file
# users are asked to send. With the feature on, an ICU4X notice lands in
# `favnyr.log` at its real level. Nothing is filtered out: the segmentation
# notice this used to silence is gone at its source instead (vendor/parley).
icu_provider = { version = "2.2", default-features = false, features = ["logging"] }

[dev-dependencies]
# Guard for the vendored parley patch (vendor/parley/PATCHES.md): the test lays
# Chinese text out through the real text engine and asserts ICU4X reports no
# missing segmentation model. ICU4X's notices arrive through `log`.
log    = "0.4"
parley = "0.8.0"

[target.'cfg(target_os = "linux")'.dependencies]
wl-clipboard-rs = { workspace = true }

# Native Windows integrations (Shell, COM/OLE, WinRT). Feature-gated to the
# APIs Favnyr actually calls; build-time bindings only, backed by system DLLs.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    # Official WPD/MTP enumeration (Android) — system API, no third-party DLL.
    "Win32_Devices_PortableDevices",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_SystemServices",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    # IImageList / SHGetImageList — JUMBO extension icons (256 px, preview mode).
    "Win32_UI_Controls",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    # File clipboard (CF_HDROP) — interop with Explorer.
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    # Native PDF thumbnails (Windows' built-in PDF engine) — WinRT, standalone.
    "Foundation",
    "Data_Pdf",
    "Storage",
    # StorageFolder::GetFolderFromPathAsync moved behind this generated feature
    # in windows 0.62 (used when sharing directories through the native sheet).
    "Storage_Search",
    "Storage_Streams",
    # Native Share sheet for the context-menu "Share" entry (WinRT).
    "ApplicationModel_DataTransfer",
] }
# `windows` 0.60+ split its COM/WinRT support into aligned sub-crates. They are
# named directly because `#[implement]` expands to `windows_core` paths and
# Favnyr turns Rust vectors into WinRT collections. Keep this trio aligned.
windows-core = "0.62.2"
windows-collections = { version = "0.3.2", default-features = false, features = ["std"] }

[build-dependencies]
slint-build = { workspace = true }

# Embeds the application icon (assets/favnyr.ico, derived from the SVG) into
# favnyr.exe via a Win32 resource (RT_GROUP_ICON). Native Windows build only
# (build scripts run on the host → cfg = host); uses rc.exe from the Windows
# SDK shipped with the MSVC toolchain.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
